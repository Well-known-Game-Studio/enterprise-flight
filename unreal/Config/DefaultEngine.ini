r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[SystemSettings]
; Lumen's screen-space traces bounce whatever sun-lit plating is on screen into every shadow on the hull. In
; empty space that fill is as bright as the lit side, so the ship loses its cast shadows, and because it is
; gathered from the screen and accumulated over frames it shifts with the camera's position, aim and distance
; and flickers in motion. The Lumen scene traces keep the real bounce; only the screen-space pass is dropped.
r.Lumen.ScreenProbeGather.ScreenTraces=0

